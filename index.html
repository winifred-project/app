<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10191d" />
    <link rel="icon" href="/app/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/app/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Winifred" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Winifred</title>
    <style>
      /* NFR-10: the app is a fixed-scale surface. The viewport meta above
         removes pinch and the JS in main.jsx closes the WebKit gesture
         loophole; touch-action here is what removes double-tap zoom, and
         `manipulation` is chosen over `none` deliberately so panning and
         scrolling are untouched. text-size-adjust stays at 100% so the
         system text size is still honoured, which is the accessibility
         route that replaces pinch. */
      html {
        background: #10191d;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        touch-action: manipulation;
      }
      body {
        margin: 0;
        background: #10191d;
        min-height: 100dvh;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #root { min-height: 100dvh; }
      button, input, textarea, select { font: inherit; }
      /* iOS zooms the whole page in when a control under 16px takes focus,
         which is the jarring one, since it happens on an ordinary tap and
         the page stays zoomed afterwards. 16px is the threshold, so this is
         a floor rather than a size: any control that sets its own larger
         size still wins. */
      input, textarea, select { font-size: max(16px, 1em); }

      /* ---------------------------------------------------------------
         CMP-6 / CMP-7 companion motion.
         All four keyframes are driven by custom properties set per mood
         on the SVG, so the tuning table lives in App.jsx next to the
         other CMP-1 mood values rather than being split across files.
         Everything animated here is transform or opacity, so it runs on
         the compositor and triggers no layout, paint or React render.
         --------------------------------------------------------------- */
      @keyframes wf-breathe {
        0%, 100% { transform: scale(1) translateY(0); }
        50%      { transform: scale(var(--wf-breath-scale)) translateY(var(--wf-breath-rise)); }
      }
      @keyframes wf-glow {
        0%, 100% { opacity: var(--wf-glow-lo); }
        50%      { opacity: var(--wf-glow-hi); }
      }
      @keyframes wf-sway {
        0%, 100% { transform: translateX(calc(var(--wf-sway) * -1)); }
        50%      { transform: translateX(var(--wf-sway)); }
      }
      @keyframes wf-shadow {
        0%, 100% { transform: scale(1); opacity: 1; }
        50%      { transform: scale(var(--wf-shadow-scale)); opacity: 0.7; }
      }
      .wf-breathe, .wf-sway, .wf-shadow {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        will-change: transform;
      }
      .wf-shadow { transform-origin: 50% 50%; }
      .wf-breathe { animation: wf-breathe var(--wf-breath-dur) ease-in-out infinite; }
      .wf-glow    { animation: wf-glow var(--wf-breath-dur) ease-in-out infinite; }
      .wf-shadow  { animation: wf-shadow var(--wf-breath-dur) ease-in-out infinite; }
      /* Deliberately not a whole-number multiple of the breath, so the two
         cycles drift against each other and the idle never visibly loops. */
      .wf-sway    { animation: wf-sway var(--wf-sway-dur) ease-in-out infinite; }
      /* CMP-8: the input-free baseline. Touch gaze only exists while a finger is
         actually on the glass, which on a phone is a fraction of a second during
         a scroll, so on its own it left the companion inert in ordinary use. The
         wander is a drift of the whole body; the glance is the eyes moving on
         their own, shorter and with holds in it so it darts and settles rather
         than sliding. Both are CSS, so they cost nothing, stop when the app is
         backgrounded and obey reduced motion without any JS involved.
         Stops are deliberately irregular and the two periods share no common
         factor with each other or with the breath, so the loop never surfaces. */
      @keyframes wf-wander {
        0%   { transform: translate(0, 0); }
        17%  { transform: translate(var(--wf-wander-x), 0); }
        31%  { transform: translate(calc(var(--wf-wander-x) * 0.3), calc(var(--wf-wander-y) * -1)); }
        46%  { transform: translate(calc(var(--wf-wander-x) * -0.8), calc(var(--wf-wander-y) * 0.4)); }
        63%  { transform: translate(calc(var(--wf-wander-x) * -0.2), var(--wf-wander-y)); }
        79%  { transform: translate(calc(var(--wf-wander-x) * 0.6), calc(var(--wf-wander-y) * -0.3)); }
        100% { transform: translate(0, 0); }
      }
      @keyframes wf-glance {
        0%, 13%   { transform: translate(0, 0); }
        18%, 29%  { transform: translate(var(--wf-glance-x), calc(var(--wf-glance-y) * -0.4)); }
        34%, 47%  { transform: translate(calc(var(--wf-glance-x) * -0.9), 0); }
        52%, 61%  { transform: translate(calc(var(--wf-glance-x) * 0.2), var(--wf-glance-y)); }
        66%, 84%  { transform: translate(calc(var(--wf-glance-x) * -0.3), calc(var(--wf-glance-y) * -0.6)); }
        89%, 100% { transform: translate(0, 0); }
      }
      /* CMP-9: blinking. A vertical squash rather than a drawn closed eye, so it
         works for every mood's eyes as they are: the dots become a line, the
         thriving arcs flatten, and nothing needs a second set of shapes.
         The timing is the whole trick. A blink on a fixed period reads as a
         metronome and is unsettling in a way people notice without being able
         to say why, so the stops below are irregular and include a double blink,
         which is what eyes actually do. Each blink is roughly 120ms of a long
         cycle, so the percentages are small and deliberately not evenly spaced. */
      @keyframes wf-blink {
        0%, 3.4%, 4.6%, 5.8%, 27%, 28.2%, 41%, 42.2%, 43.4%, 44.6%, 68%, 69.2%, 89%, 90.2%, 100% {
          transform: scaleY(1);
        }
        4%, 5.2%, 27.6%, 41.6%, 44%, 68.6%, 89.6% { transform: scaleY(0.08); }
      }
      .wf-blink {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: wf-blink var(--wf-blink-dur) linear infinite;
      }
      .wf-wander { animation: wf-wander var(--wf-wander-dur) ease-in-out infinite; }
      .wf-glance { animation: wf-glance var(--wf-glance-dur) ease-in-out infinite; }

      /* CMP-7: the trailing transition is what makes the parallax read as a
         look rather than a jump. The JS only ever sets a target. */
      .wf-parallax { transition: transform 520ms cubic-bezier(0.22, 1, 0.36, 1); }
      .wf-gaze     { transition: transform 380ms cubic-bezier(0.22, 1, 0.36, 1); }

      /* NFR-9: no movement at all under reduced motion. The glow keeps a very
         slow opacity fade, which is not motion and is the one cue that stops
         the companion reading as a broken image. */
      @media (prefers-reduced-motion: reduce) {
        .wf-breathe, .wf-sway, .wf-shadow, .wf-wander, .wf-glance, .wf-blink { animation: none !important; }
        .wf-glow { animation-duration: 14s !important; }
        .wf-parallax, .wf-gaze { transform: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
